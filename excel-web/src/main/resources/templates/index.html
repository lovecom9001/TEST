<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel to PDF</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { background: white; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.1); padding: 48px; max-width: 520px; width: 90%; text-align: center; }
        h1 { font-size: 28px; color: #1a1a2e; margin-bottom: 8px; }
        p.desc { color: #666; margin-bottom: 32px; font-size: 15px; }
        .upload-area { border: 2px dashed #c0c0c0; border-radius: 12px; padding: 48px 24px; cursor: pointer; transition: all 0.3s; }
        .upload-area:hover { border-color: #4361ee; background: #f8f9ff; }
        .upload-area.dragover { border-color: #4361ee; background: #eef1ff; }
        .upload-icon { font-size: 48px; margin-bottom: 12px; }
        .upload-text { color: #555; font-size: 15px; }
        .upload-text strong { color: #4361ee; }
        input[type="file"] { display: none; }
        .file-name { margin-top: 16px; padding: 12px; background: #e8f5e9; border-radius: 8px; color: #2e7d32; font-weight: 500; display: none; }
        .btn { display: inline-block; padding: 14px 40px; background: #4361ee; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 24px; }
        .btn:hover { background: #3a56d4; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .steps { display: flex; justify-content: center; gap: 8px; margin-bottom: 32px; }
        .step { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }
        .step.active { background: #4361ee; color: white; }
        .step.inactive { background: #e0e0e0; color: #999; }
    </style>
</head>
<body>
<div class="container">
    <div class="steps">
        <div class="step active">1</div>
        <div class="step inactive">2</div>
        <div class="step inactive">3</div>
    </div>

    <h1>Excel to PDF</h1>
    <p class="desc">엑셀 파일을 업로드하고, 셀을 편집한 뒤 PDF로 다운로드하세요.</p>

    <form id="uploadForm" action="/upload" method="post" enctype="multipart/form-data">
        <div class="upload-area" id="dropZone" onclick="document.getElementById('fileInput').click()">
            <div class="upload-icon">&#128196;</div>
            <div class="upload-text"><strong>클릭</strong> 또는 파일을 드래그하세요<br>.xlsx 파일만 지원</div>
        </div>
        <input type="file" id="fileInput" name="file" accept=".xlsx,.xls">
        <div class="file-name" id="fileName"></div>
        <button type="submit" class="btn" id="uploadBtn" disabled>업로드</button>
    </form>
</div>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileName = document.getElementById('fileName');
    const uploadBtn = document.getElementById('uploadBtn');

    fileInput.addEventListener('change', function() {
        if (this.files.length > 0) {
            fileName.textContent = this.files[0].name;
            fileName.style.display = 'block';
            uploadBtn.disabled = false;
        }
    });

    dropZone.addEventListener('dragover', function(e) { e.preventDefault(); this.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', function() { this.classList.remove('dragover'); });
    dropZone.addEventListener('drop', function(e) {
        e.preventDefault();
        this.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0) {
            fileInput.files = e.dataTransfer.files;
            fileName.textContent = e.dataTransfer.files[0].name;
            fileName.style.display = 'block';
            uploadBtn.disabled = false;
        }
    });
</script>
</body>
</html>
