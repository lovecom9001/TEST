<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시트 선택 - Excel to PDF</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { background: white; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.1); padding: 48px; max-width: 520px; width: 90%; }
        h1 { font-size: 24px; color: #1a1a2e; margin-bottom: 8px; text-align: center; }
        .file-info { text-align: center; color: #666; margin-bottom: 32px; font-size: 14px; }
        .sheet-list { list-style: none; }
        .sheet-item { margin-bottom: 12px; }
        .sheet-btn { display: block; width: 100%; padding: 16px 20px; background: #f8f9fa; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; color: #333; cursor: pointer; transition: all 0.2s; text-align: left; }
        .sheet-btn:hover { border-color: #4361ee; background: #f0f3ff; }
        .sheet-icon { margin-right: 8px; }
        .back-link { display: block; text-align: center; margin-top: 24px; color: #888; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: #4361ee; }
        .steps { display: flex; justify-content: center; gap: 8px; margin-bottom: 32px; }
        .step { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }
        .step.done { background: #4caf50; color: white; }
        .step.active { background: #4361ee; color: white; }
        .step.inactive { background: #e0e0e0; color: #999; }
    </style>
</head>
<body>
<div class="container">
    <div class="steps">
        <div class="step done">&#10003;</div>
        <div class="step active">2</div>
        <div class="step inactive">3</div>
    </div>

    <h1>시트 선택</h1>
    <p class="file-info" th:text="'파일: ' + ${fileName}"></p>

    <div th:if="${error}" style="padding:12px 16px; background:#ffebee; color:#c62828; border-radius:8px; margin-bottom:20px; font-size:14px;" th:text="${error}"></div>

    <ul class="sheet-list">
        <li class="sheet-item" th:each="name : ${sheetNames}">
            <form action="/sheet" method="post" style="margin:0;">
                <input type="hidden" name="sheetName" th:value="${name}">
                <button type="submit" class="sheet-btn">
                    <span class="sheet-icon">&#128209;</span>
                    <span th:text="${name}"></span>
                </button>
            </form>
        </li>
    </ul>

    <a href="/" class="back-link">&#8592; 다른 파일 업로드</a>
</div>
</body>
</html>
